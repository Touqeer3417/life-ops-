services:
  postgres:
    image: postgres:17-alpine
    container_name: lifeops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifeops
      POSTGRES_USER: lifeops
      POSTGRES_PASSWORD: lifeops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeops -d lifeops"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - lifeops_postgres_data:/var/lib/postgresql/data

volumes:
  lifeops_postgres_data:
