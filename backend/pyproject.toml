[project]
name = "lifeops-ai-backend"
version = "0.1.0"
description = "LifeOps AI Phase 1 FastAPI foundation"
requires-python = ">=3.11,<3.14"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
